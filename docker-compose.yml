version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: strataflow-postgres
    restart: always
    environment:
      POSTGRES_USER: strataflow_user
      POSTGRES_PASSWORD: strataflow_secure_password_2026
      POSTGRES_DB: strataflow_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U strataflow_user -d strataflow_db']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strataflow-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: '*'
      DATABASE_URL: postgresql://strataflow_user:strataflow_secure_password_2026@postgres:5432/strataflow_db?schema=public
      STELLAR_NETWORK: TESTNET
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      HORIZON_URL: https://horizon-testnet.stellar.org
      STRATAFLOW_CONTRACT_ID: CDXVD3AA43SE2D52ZBJSH3RDKAPOYG6OCDAZGSQD6M5TCBQIG3HTLY6J
      SERVER_SECRET_KEY: SCZANGBA5YHTNYVVV4C3U252E2B6P6IRKDIOINZCAHSKV27QIN2YQZAA
      JWT_SECRET: strataflow-production-jwt-super-secret-key-32chars!
    ports:
      - '3001:3001'

volumes:
  pgdata:
    driver: local
