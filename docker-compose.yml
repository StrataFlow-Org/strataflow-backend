version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strataflow_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://strataflow:strataflow_secret@postgres:5432/strataflow_db?schema=public
      - REDIS_URL=redis://redis:6379
      - SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: strataflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: strataflow
      POSTGRES_PASSWORD: strataflow_secret
      POSTGRES_DB: strataflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strataflow -d strataflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: strataflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
